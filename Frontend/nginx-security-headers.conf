add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://images.unsplash.com; img-src 'self' data: https://images.unsplash.com https://cdn-jdbol.nitrocdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.googletagmanager.com https://www.google.com; media-src 'self' blob:" always;

types {
  image/avif avif;
  image/webp webp;
  video/webm webm;
  application/javascript js;
  text/css css;
  application/wasm wasm;
}
